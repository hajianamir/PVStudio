# US NEC / IEEE Utility-Scale Compliance Profile
profile_id: "US-NEC-2020-v1"
market: "United States"
jurisdiction: "US-NEC"
version: "1.0.0"
effective_date: "2020-01-01"

dc_system:
  max_voltage_residential_v: 600
  max_voltage_commercial_v: 1000
  max_voltage_utility_v: 1500
  dc_ampacity_factor: 1.25
  rapid_shutdown_required: true

ac_interconnection:
  busbar_120_percent_rule_enabled: true
  feeder_125_percent_rule_enabled: true
  lv_max_capacity_kw: 250.0
  mv_nominal_voltage_kv: 13.8
  hv_voltage_levels_kv: [115.0, 138.0, 230.0, 345.0, 500.0]  # Full US HV transmission grid levels
  min_required_dscr: 1.20      # Profile-driven bankable DSCR threshold

tariff_defaults:
  currency_symbol: "$"
  retail_rate_usd_kwh: 0.18
  feed_in_tariff_usd_kwh: 0.05
  tax_credit_percent: 30.0       # Inflation Reduction Act (IRA) ITC
  net_metering_type: "NET_METERING_1_0"

standards_citations:
  fuse_standard: "UL 2579 (per NEC 690.9)"
  breaker_standard: "UL 489 / NEC 240"
  spd_standard: "UL 1449 Type 1 or Type 2"
  grounding_standard: "NEC Article 250 / IEEE 80"
  lightning_standard: "NFPA 780 / IEEE 1410"
  lv_grid_connection_standard: "IEEE 1547-2018 / UL 1741 SB"
  mv_grid_connection_standard: "IEEE 1547-2018 / NEC Article 705"
  hv_grid_connection_standard: "NERC PRC Standards / IEEE C37"
