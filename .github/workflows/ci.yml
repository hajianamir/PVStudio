name: PVStudio CI Pipeline

on:
  push:
    branches: [ "main", "phase-2/c-and-i", "feature/**" ]
  pull_request:
    branches: [ "main", "phase-2/c-and-i" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install .[dev]

    - name: Run Phase 1 Regression Gate Suite
      run: |
        python tests/run_phase1_acceptance_gates.py

    - name: Run Pytest Test Suite
      run: |
        pytest -v tests/
